# Pre-warm search caches after the Monday dump (#706, hardened #754).
#
# The weekly pg_dump (Mon 05:00 UTC) reads the whole database and evicts the
# hot pages the heaviest research questions depend on; the first cold hit on
# a stratified question can exceed the 60s edge timeout and fail once
# before server-side warming kicks in. This workflow fires the curated
# outreach-question set at 06:00 UTC so no human is ever the cold first hit.
# It also refreshes the 7-day query-expansion caches weekly.
#
# Pass 1 warms (refresh=true rebuilds; timeouts tolerated — a timed-out
# request still builds server-side). Pass 2 VERIFIES a cache hit: it strips
# refresh=true and retries each question until it returns 200, because a
# green run with cold caches would silently hand the next visitor (or the
# completeness eval) the cold-build latency (#754). Aspect-stratified builds
# (#753) run longer than the old single-query ones, so verification polls
# rather than sampling once. Every network call is ||-guarded — GitHub runs
# steps under bash -e, and a transient non-2xx must not kill the loop
# (lesson from the v1.5.5 deploy-verify false-failure).
#
# Pacing: 15s between pass-1 requests keeps the initial sweep under the
# 20-requests-per-5-minutes search rate limit; pass-2 retries poll at 30s.

name: Pre-warm search caches

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, after the 05:00 UTC dump
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: 'Pass 1: warm (rebuild) every question'
        run: |
          while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            url=$(jq -r '.url' <<<"$row")
            t0=$(date +%s)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || true)
            echo "warm ${name}: HTTP ${code:-000} in $(( $(date +%s) - t0 ))s"
            sleep 15
          done < <(jq -c '.[]' scripts/prewarm-questions.json)
      - name: 'Pass 2: verify every cache serves 200 (bounded retries)'
        run: |
          failures=0
          while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            url=$(jq -r '.url' <<<"$row" | sed 's/refresh=true/refresh=false/')
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "verify ${name}: attempt ${attempt} HTTP ${code:-000} — waiting"
              sleep 30
            done
            if [ "$ok" = "1" ]; then
              echo "verify ${name}: 200"
            else
              echo "verify ${name}: NEVER reached 200"
              failures=$((failures + 1))
            fi
            sleep 5
          done < <(jq -c '.[]' scripts/prewarm-questions.json)
          echo "unverified questions: $failures"
          # A cold cache after warm+retries is actionable (build crash, slot
          # wedge, deploy regression) — fail loudly instead of green-and-cold.
          exit "$failures"
