name: Deploy to production

# Tag-gated production deploy (#628). Fires ONLY on a `v*` tag — a push to main
# never deploys on its own. Refuses to ship unless the tagged commit's required
# CI checks (lint/build/test) are green, then triggers a Render deploy pinned to
# the tagged commit. Net effect: reaching production requires a deliberate,
# CI-verified version tag, so a raw push (or a compromised credential that lands
# code on main) cannot silently deploy. Rollback stays a Render-dashboard action.
#
# One-time setup (see DEPLOYMENT.md → "Tag-gated production deploys"):
#   - secret  RENDER_API_KEY       — a Render API key (Account Settings → API Keys)
#   - variable RENDER_SERVICE_IDS  — comma-separated Render service IDs to deploy
#                                    (the web service + the three crons)

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          REQUIRED="lint build test"
          echo "Gating deploy of $SHA on required checks: $REQUIRED"
          deadline=$(( SECONDS + 900 ))   # wait up to 15 min for CI to finish
          while :; do
            # || true: under bash -e a transient API failure would kill the
            # step on this assignment before the retry branch below can run
            # (two false-failed deploys on 2026-08-11; v1.5.5 lesson class).
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>/dev/null || true)
            if [ -z "$runs" ]; then
              echo "check-runs query failed; will retry"
            else
              pending=0
              failed=""
              for name in $REQUIRED; do
                latest=$(printf '%s' "$runs" | jq -r --arg n "$name" '
                  [.check_runs[] | select(.name == $n)]
                  | sort_by(.started_at) | last
                  | if . == null then "absent"
                    else "\(.status):\(.conclusion // "none")" end' 2>/dev/null || echo absent)
                case "$latest" in
                  completed:success) ;;
                  completed:*) failed="$failed $name(${latest#completed:})" ;;
                  *) pending=$(( pending + 1 )) ;;
                esac
              done
              if [ -n "$failed" ]; then
                echo "::error::Required check(s) not passing on $SHA:$failed — refusing to deploy."
                exit 1
              fi
              if [ "$pending" -eq 0 ]; then
                echo "All required checks green on $SHA."
                exit 0
              fi
              echo "$pending required check(s) still pending on $SHA; waiting 30s..."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 15m waiting for CI ($REQUIRED) on $SHA."
              exit 1
            fi
            sleep 30
          done

      - name: Trigger Render deploy (pinned to the tagged commit)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # Service IDs are non-sensitive config — a repo variable is idiomatic
          # (and keeps them readable in logs), but a secret works too. Accept
          # either: prefer the variable, fall back to the secret.
          RENDER_SERVICE_IDS: ${{ vars.RENDER_SERVICE_IDS || secrets.RENDER_SERVICE_IDS }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set — see DEPLOYMENT.md (#628 setup)."
            exit 1
          fi
          if [ -z "${RENDER_SERVICE_IDS:-}" ]; then
            echo "::error::RENDER_SERVICE_IDS variable is not set — see DEPLOYMENT.md (#628 setup)."
            exit 1
          fi
          IFS=',' read -ra IDS <<< "$RENDER_SERVICE_IDS"
          fail=0
          for raw in "${IDS[@]}"; do
            id=$(printf '%s' "$raw" | tr -d '[:space:]')
            [ -n "$id" ] || continue
            # Render rejects `commitId` for cron jobs ("cannot deploy cron job
            # service by commit reference ID"). Web/other services pin the exact
            # tagged commit; crons deploy their connected-branch HEAD — which is
            # the tagged commit, since releases tag main HEAD.
            case "$id" in
              crn-*) payload='{}' ;;
              *) payload="{\"commitId\":\"$SHA\",\"clearCache\":\"do_not_clear\"}" ;;
            esac
            echo "→ Deploying $id @ $SHA"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://api.render.com/v1/services/$id/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload") || code="000"
            if [ "${code#2}" != "$code" ]; then
              echo "  OK ($code): $(jq -r '.id // "deploy queued"' /tmp/resp.json 2>/dev/null || echo queued)"
            else
              echo "::error::Render deploy failed for $id (HTTP $code): $(cat /tmp/resp.json 2>/dev/null)"
              fail=1
            fi
          done
          exit $fail

      # Close the async gap (#664): triggering a Render deploy only queues it.
      # Poll /api/version until the web service reports the tagged commit, so
      # "workflow green" means the new code is confirmed serving — not merely
      # queued. A timeout here fails the workflow, which pages ops (#665).
      - name: Verify new code is live
        env:
          SHA: ${{ github.sha }}
          SITE: https://democracymonitor.us
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          echo "Waiting for $SITE/api/version to report commit $SHA ..."
          # Render build + cutover can take ~13 min (measured on v1.5.4); allow
          # 25 min of headroom so a normal slow build doesn't false-fail. A
          # build genuinely exceeding this is itself worth surfacing.
          deadline=$(( SECONDS + 1500 ))
          while :; do
            # GitHub runs this step with `bash -e`, so the curl|jq pipeline MUST
            # NOT be allowed to fail the script: during the build the old code
            # 404s and the cutover 502s, and jq parse-errors on that non-JSON
            # (this false-failed v1.5.5 in 81s). `|| true` keeps a transient
            # non-JSON response an empty string, not a step failure.
            running=$(curl -sS -m 15 "$SITE/api/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
            # Match if the running commit is a prefix of the tagged SHA (or
            # equal) — tolerant of Render reporting a short vs full hash.
            # Empty/'unknown' never matches (prefix removal leaves SHA unchanged).
            if [ -n "$running" ] && [ "$running" != "unknown" ] && [ "${SHA#"$running"}" != "$SHA" ]; then
              echo "Verified: $SITE is serving $running (matches $SHA)."
              # Non-fatal: warn if package.json version wasn't bumped to match the
              # tag, so the Architecture-page version doesn't silently lag. The
              # commit match above is the deploy gate; this only flags the label.
              ver=$(curl -sS -m 15 "$SITE/api/version" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
              if [ -n "$ver" ] && [ "v$ver" != "$REF_NAME" ]; then
                echo "::warning::/api/version reports v$ver but the tag is $REF_NAME — bump package.json version before tagging (see DEPLOYMENT.md)."
              fi
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 25m — $SITE still serving '${running:-unreachable}', expected $SHA. The Render build likely failed; prod is on OLD code."
              exit 1
            fi
            echo "  running='${running:-unreachable}' (want $SHA); waiting 20s..."
            sleep 20
          done

  # Page the ops inbox on ANY deploy-job failure (#665): CI-gate red, Render
  # trigger failure, or the verify-live timeout above. Runs in Actions so it
  # works even if prod is down. No-ops with a log line if the Resend secrets
  # are unset, so an unconfigured repo never fails the notify job itself.
  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Email ops on deploy failure
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
          FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Democracy Monitor <updates@democracymonitor.us>' }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${OPS_ALERT_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or OPS_ALERT_EMAIL not set — skipping deploy-failure email (see DEPLOYMENT.md)."
            exit 0
          fi
          html="<h2 style=\"font-family:sans-serif\">Deploy FAILED: ${REF_NAME}</h2><p style=\"font-family:sans-serif\">The tag-gated production deploy did not complete. Production is on the PREVIOUS release. Investigate before assuming the release is live.</p><p style=\"font-family:sans-serif\"><a href=\"${RUN_URL}\">View the failed run</a></p>"
          payload=$(jq -n --arg from "$FROM_EMAIL" --arg to "$OPS_ALERT_EMAIL" --arg subj "Deploy FAILED: ${REF_NAME}" --arg html "$html" \
            '{from:$from, to:[$to], subject:$subj, html:$html}')
          code=$(curl -sS -o /tmp/resend.json -w '%{http_code}' -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "$payload") || code="000"
          if [ "${code#2}" = "$code" ]; then
            echo "::error::Resend send failed (HTTP $code): $(cat /tmp/resend.json 2>/dev/null)"
            exit 1
          fi
          echo "Deploy-failure email sent to ops inbox (HTTP $code)."
