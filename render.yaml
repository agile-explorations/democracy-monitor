services:
  - type: web
    name: democracy-monitor
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm db:init && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://democracymonitor.us
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: LEGISCAN_API_KEY
        sync: false

  - type: keyvalue
    name: epd-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: cron
    name: weekly-dump
    runtime: node
    schedule: '0 5 * * 1'
    buildCommand: pnpm install
    startCommand: ./scripts/weekly-dump.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false

  - type: cron
    name: weekly-snapshot
    runtime: node
    schedule: '0 3 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/snapshot.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false

  - type: cron
    name: weekly-legiscan
    runtime: node
    schedule: '0 1 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/legiscan-bulk.ts
    envVars:
      - key: NODE_OPTIONS
        value: '--max-old-space-size=1024'
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: LEGISCAN_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false

databases:
  - name: epd-db
    plan: basic-1gb
    databaseName: epd
    postgresMajorVersion: '17'

