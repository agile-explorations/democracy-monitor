services:
  - type: web
    name: democracy-monitor
    runtime: node
    plan: standard
    # Tag-gated deploys (#628): a push to main does NOT auto-deploy. Production
    # deploys only via .github/workflows/deploy.yml, which fires on a `v*` tag
    # and refuses to ship unless the tagged commit's CI is green. A raw push (or
    # a compromised credential) therefore can't reach prod without a deliberate,
    # CI-verified tag. Rollback (Render dashboard) is unaffected.
    autoDeploy: false
    buildCommand: pnpm install && pnpm db:init && pnpm build
    startCommand: pnpm start
    disk:
      name: data-disk
      mountPath: /var/data
      # Verified against the Render dashboard 2026-07-25 (#560). Must hold one
      # full dump (~6.2 GB and growing; the previous dump is deleted before a
      # new one is written, so peak usage is a single dump).
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://democracymonitor.us
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: LEGISCAN_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Off-provider backup to Backblaze B2 (#617). Values set in the dashboard.
      # The bucket has Object Lock (Compliance, ~30-day retention); a Lifecycle
      # Rule reclaims objects after they age out. Key is write/list, bucket-scoped.
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false

  - type: keyvalue
    name: epd-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: cron
    name: weekly-dump
    runtime: node
    plan: starter
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 5 * * 1'
    buildCommand: echo "trigger only"
    startCommand: ./scripts/weekly-dump.sh
    envVars:
      - key: SITE_URL
        value: https://democracymonitor.us
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: weekly-snapshot
    runtime: node
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 3 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/snapshot.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Democracy Monitor <updates@democracymonitor.us>
      - key: OPS_ALERT_EMAIL
        sync: false

  - type: cron
    name: weekly-legiscan
    runtime: node
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 1 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/legiscan-bulk.ts
    envVars:
      - key: NODE_OPTIONS
        value: '--max-old-space-size=1024'
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: LEGISCAN_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false

databases:
  - name: epd-db
    plan: basic-1gb
    databaseName: epd
    postgresMajorVersion: '17'

