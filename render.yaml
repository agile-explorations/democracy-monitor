services:
  - type: web
    name: democracy-monitor
    runtime: node
    plan: standard
    # Tag-gated deploys (#628): a push to main does NOT auto-deploy. Production
    # deploys only via .github/workflows/deploy.yml, which fires on a `v*` tag
    # and refuses to ship unless the tagged commit's CI is green. A raw push (or
    # a compromised credential) therefore can't reach prod without a deliberate,
    # CI-verified tag. Rollback (Render dashboard) is unaffected.
    autoDeploy: false
    buildCommand: pnpm install && pnpm db:init && pnpm build
    startCommand: pnpm start
    # Zero-downtime deploys (#730): Render holds traffic on the old instance
    # until the new one answers 200 here (a real DB round trip, not just
    # port-open) — eliminates the ~40s cutover 502 window. In-flight search
    # builds on the old instance die at swap; the #729 client retry +
    # Redis-backed coalescing recover them on the new instance.
    # NOTE (#731): the data-disk is REMOVED — pg_dump streams straight to B2
    # (lib/cron/stream-dump.ts) and dump status lives in the dump_runs table.
    # A disk-attached service can never do zero-downtime deploys (the disk
    # mounts one instance, forcing stop-before-start); with it gone, the
    # healthCheckPath below enables true overlapped cutover.
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://democracymonitor.us
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: LEGISCAN_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Off-provider backup to Backblaze B2 (#617). Values set in the dashboard.
      # The bucket has Object Lock (Compliance, ~30-day retention); a Lifecycle
      # Rule reclaims objects after they age out. Key is write/list, bucket-scoped.
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      # Public download bucket (#636): a SEPARATE public, non-Object-Locked
      # bucket with its own write-only key (can't read the backup bucket's PII).
      # The dump cron overwrites database.pgdump here; /api/data/dump 302s to it.
      - key: B2_DOWNLOAD_BUCKET
        sync: false
      - key: B2_DOWNLOAD_KEY_ID
        sync: false
      - key: B2_DOWNLOAD_APP_KEY
        sync: false

  - type: keyvalue
    name: epd-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: cron
    name: weekly-dump
    runtime: node
    plan: standard # 2 GB (#828): the proof job was oomKilled at 512Mi — node/tsx baseline + two 100 MB multipart buffers exceeds starter; cron billing is per runtime-second, so this costs pennies
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 5 * * 1'
    # #828: the dump runs ON this container — a web-service deploy can no
    # longer kill an in-flight dump (v1.20.1 killed run 3 at 7.46 GB).
    # scripts/weekly-dump.sh remains the manual HTTP-trigger path.
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/stream-dump.ts --standalone
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      # Post-dump steps (alias replay + prewarm, #729/#722) run here too.
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_DOWNLOAD_BUCKET
        sync: false
      - key: B2_DOWNLOAD_KEY_ID
        sync: false
      - key: B2_DOWNLOAD_APP_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: weekly-snapshot
    runtime: node
    plan: standard # 2 GB (#777): the 08-24 fix raised V8's heap but left the 512 MB default plan — the container, not V8, OOM-killed on 08-31
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 3 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/snapshot.ts
    envVars:
      # 2026-08-24/08-31 OOMs (#777): the hot-entity sweep outgrew the
      # defaults past 300k scanned docs. The heap ceiling must stay well
      # under the container plan above; a memory-bounded sweep is the
      # durable fix (backlog, #777).
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Democracy Monitor <updates@democracymonitor.us>
      - key: OPS_ALERT_EMAIL
        sync: false

  - type: cron
    name: weekly-legiscan
    runtime: node
    autoDeploy: false # tag-gated (#628) — deployed with the web service on a v* tag
    schedule: '0 1 * * 1'
    buildCommand: pnpm install
    startCommand: npx tsx lib/cron/legiscan-bulk.ts
    envVars:
      - key: NODE_OPTIONS
        value: '--max-old-space-size=1024'
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: LEGISCAN_API_KEY
        sync: false
      - key: GOVINFO_API_KEY
        sync: false

databases:
  - name: epd-db
    # CAUTION (#780): Blueprint syncs ENFORCE this value. On 2026-08-17 a
    # re-sync silently downgraded the dashboard-upgraded Pro-4gb instance to
    # the stale basic-1gb below — a week of the 2.6GB search working set not
    # fitting in RAM. Any dashboard plan change MUST be mirrored here in the
    # same sitting; `pnpm validate:infra` diffs this file against the live
    # Render API to catch drift.
    # Round B (#790, 2026-08-27): 2 CPU / 8 GB — the ~2 GB index working set fits;
    # novel builds ~35-40% faster, heaviest probe finishes with margin (owner decision).
    plan: 2c-8g
    databaseName: epd
    postgresMajorVersion: '17'

