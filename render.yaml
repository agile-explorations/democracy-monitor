services:
  - type: web
    name: democracy-monitor
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm db:init && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: epd-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: epd-db
    plan: basic-1gb
    databaseName: epd
    postgresMajorVersion: '16'

keyValueStores:
  - name: epd-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

